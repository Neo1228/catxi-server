global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: redis-exporter
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: catxi-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - targets/backend.yml
        refresh_interval: 30s

  - job_name: catxi-worker
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - targets/worker.yml
        refresh_interval: 30s
