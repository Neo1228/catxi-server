groups:
  - name: catxi-api
    rules:
      - alert: CatxiApiDown
        expr: up{job="catxi-backend"} == 0
        for: 1m
        labels:
          severity: critical
          service: catxi-api
        annotations:
          summary: "Catxi API 연결 실패: {{ $labels.instance }}"
          description: "API 메트릭 수집이 1분 이상 실패했습니다. 앱 상태와 관리 포트 방화벽을 확인하세요."

      - alert: CatxiApiHighErrorRate
        expr: >-
          sum by (instance) (rate(http_server_requests_seconds_count{
            job="catxi-backend",status=~"5.."}[5m]))
          /
          sum by (instance) (rate(http_server_requests_seconds_count{
            job="catxi-backend"}[5m])) > 0.05
        for: 3m
        labels:
          severity: warning
          service: catxi-api
        annotations:
          summary: "Catxi API 5xx 비율이 높습니다: {{ $labels.instance }}"
          description: "최근 5분간 5xx 비율이 {{ $value | humanizePercentage }}입니다. 애플리케이션과 의존 서비스 로그를 확인하세요."

      - alert: CatxiApiSlowResponses
        expr: >-
          histogram_quantile(0.95, sum by (le, instance) (
            rate(http_server_requests_seconds_bucket{job="catxi-backend"}[5m]))) > 1.5
        for: 3m
        labels:
          severity: warning
          service: catxi-api
        annotations:
          summary: "Catxi API 응답 지연: {{ $labels.instance }}"
          description: "최근 5분간 95백분위 응답 시간이 {{ $value }}초입니다."

      - alert: CatxiApiHeapUsageHigh
        expr: >-
          sum by (instance) (jvm_memory_used_bytes{job="catxi-backend",area="heap"})
          /
          sum by (instance) (jvm_memory_max_bytes{job="catxi-backend",area="heap"}) > 0.85
        for: 3m
        labels:
          severity: warning
          service: catxi-api
        annotations:
          summary: "Catxi API 힙 사용량이 높습니다: {{ $labels.instance }}"
          description: "힙 사용률이 {{ $value | humanizePercentage }}입니다."

      - alert: CatxiDatabasePoolUsageHigh
        expr: >-
          hikaricp_connections_active{job="catxi-backend"}
          /
          hikaricp_connections_max{job="catxi-backend"} > 0.8
        for: 3m
        labels:
          severity: warning
          service: catxi-api
        annotations:
          summary: "데이터베이스 연결 풀이 포화에 가깝습니다: {{ $labels.instance }}"
          description: "활성 연결 비율이 {{ $value | humanizePercentage }}입니다. 장기 트랜잭션과 쿼리 지연을 확인하세요."

  - name: catxi-worker
    rules:
      - alert: CatxiNotificationWorkerDown
        expr: up{job="catxi-worker"} == 0
        for: 1m
        labels:
          severity: critical
          service: catxi-worker
        annotations:
          summary: "워커 연결 실패: {{ $labels.instance }}"
          description: "워커 메트릭 수집이 1분 이상 실패했습니다. FCM 아웃박스 적체 여부도 확인하세요."

      - alert: CatxiFcmOutboxBacklog
        expr: catxi_fcm_outbox_pending_sampled{job="catxi-worker"} > 1000
        for: 5m
        labels:
          severity: warning
          service: catxi-worker
        annotations:
          summary: "FCM 아웃박스 대기 건수가 많습니다: {{ $labels.instance }}"
          description: "대기 행이 1,000건을 5분 이상 초과했습니다. 10,001은 그 이상을 뜻합니다."

      - alert: CatxiFcmRedisStreamBacklog
        expr: >-
          catxi_fcm_stream_size{job="catxi-worker"}
          /
          catxi_fcm_stream_max_backlog{job="catxi-worker"} > 0.9
        for: 5m
        labels:
          severity: warning
          service: catxi-worker
        annotations:
          summary: "FCM Redis Stream 적체가 상한을 넘었습니다: {{ $labels.instance }}"
          description: "설정된 Redis Stream 상한의 90%를 넘었습니다. DB 아웃박스 발행을 일시 중지하며 Redis 소비 상태와 Firebase 오류를 확인하세요. 미처리 메시지는 길이 제한으로 삭제하지 않습니다."

      - alert: CatxiFcmFirstDueEventDelay
        expr: catxi_fcm_outbox_first_due_event_age_seconds{job="catxi-worker"} > 300
        for: 5m
        labels:
          severity: warning
          service: catxi-worker
        annotations:
          summary: "FCM 아웃박스 처리 지연: {{ $labels.instance }}"
          description: "가장 먼저 처리 가능한 이벤트의 생성 후 경과 시간이 5분을 넘었습니다."

      - alert: CatxiFcmDeadLetterGrowth
        expr: catxi_fcm_dead_letter_failures_15m{job="catxi-worker"} > 0
        for: 1m
        labels:
          severity: warning
          service: catxi-worker
        annotations:
          summary: "최근 FCM 알림이 DLQ에 적재됐습니다: {{ $labels.instance }}"
          description: "최근 15분 실패 기록을 확인하고 재처리 또는 장기 보존 정책을 점검하세요."

      - alert: CatxiWorkerMetricsStale
        expr: time() - catxi_worker_metrics_last_success_epoch_seconds{job="catxi-worker"} > 120
        for: 1m
        labels:
          severity: warning
          service: catxi-worker
        annotations:
          summary: "워커의 DB 운영 지표 갱신이 중단됐습니다: {{ $labels.instance }}"
          description: "DB 연결과 워커 로그를 확인하세요."

  - name: catxi-infrastructure
    rules:
      - alert: CatxiRedisExporterDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis 메트릭 수집 실패"
          description: "Redis exporter 상태와 Redis 연결 설정을 확인하세요."

      - alert: CatxiNodeDiskSpaceLow
        expr: >-
          node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",
            mountpoint!~"/(sys|proc|dev|run).*"}
          /
          node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",
            mountpoint!~"/(sys|proc|dev|run).*"} < 0.15
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "호스트 디스크 여유 공간 부족: {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "사용 가능한 공간이 {{ $value | humanizePercentage }} 미만입니다. Loki와 컨테이너 로그 용량을 확인하세요."

      - alert: CatxiNodeInodesLow
        expr: >-
          node_filesystem_files_free{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",
            mountpoint!~"/(sys|proc|dev|run).*"}
          /
          node_filesystem_files{job="node-exporter",fstype!~"tmpfs|overlay|squashfs",
            mountpoint!~"/(sys|proc|dev|run).*"} < 0.1
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "호스트 inode 여유 부족: {{ $labels.instance }} {{ $labels.mountpoint }}"
          description: "inode 여유가 10% 미만입니다. 파일 수가 많은 로그와 임시 파일을 확인하세요."
