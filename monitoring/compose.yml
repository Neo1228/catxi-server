x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"

services:
  grafana:
    image: docker.io/grafana/grafana:13.2.3
    container_name: catxi_grafana
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:?Set GRAFANA_SECRET_KEY}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3000}
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_SECURITY_COOKIE_SECURE: ${GF_SECURITY_COOKIE_SECURE:-false}
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_LEVEL: info
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    mem_limit: 768m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    container_name: catxi_prometheus
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=8GB
      - --query.timeout=2m
      - --query.max-concurrency=20
      - --log.level=warn
    depends_on:
      - alertmanager
      - node-exporter
      - redis-exporter
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: docker.io/prom/alertmanager:v0.34.1
    container_name: catxi_alertmanager
    restart: unless-stopped
    logging: *default-logging
    user: "0:0"
    read_only: true
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - ./secrets/discord-webhook-url:/run/secrets/discord-webhook-url:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost:9093
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  loki:
    image: docker.io/grafana/loki:3.7.8
    container_name: catxi_loki
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${LOKI_BIND_PORT:-3100}:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - -config.file=/etc/loki/loki.yml
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  alloy:
    image: docker.io/grafana/alloy:v1.20.1
    container_name: catxi_alloy
    restart: unless-stopped
    logging: *default-logging
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/monitoring.alloy:/etc/alloy/config.alloy:ro
      - /var/log:/var/log:ro
      - alloy_monitoring_data:/var/lib/alloy/data
    depends_on:
      - loki
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1
    container_name: catxi_node_exporter
    restart: unless-stopped
    logging: *default-logging
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/host/root
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.max-requests=50
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.93.0
    container_name: catxi_redis_exporter
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_ADDR: ${REDIS_SCHEME:-redis}://${REDIS_HOST:?Set REDIS_HOST}:${REDIS_PORT:-6379}
      REDIS_USER: ${REDIS_EXPORTER_USER:?Set REDIS_EXPORTER_USER}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?Set REDIS_EXPORTER_PASSWORD}
      REDIS_EXPORTER_SKIP_TLS_VERIFICATION: "false"
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:
  alloy_monitoring_data:

networks:
  default:
    name: catxi_monitoring
