plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    compileOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

    runtimeOnly libs.r2dbc.mysql
    implementation libs.firebase.admin
    implementation libs.prometheus.registry
    compileOnly libs.lombok
    annotationProcessor libs.lombok
}

tasks.named('bootJar') {
    archiveFileName = 'catxi-worker.jar'
    mainClass = 'com.catxi.worker.CatxiWorkerApplication'
}
